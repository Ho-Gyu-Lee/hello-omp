# omp portable settings — applied via `omp config set <key> <value>`
# Format: <key><space><value>   (one per line)
#   - value is compact JSON (no spaces) for record/array keys, or a scalar
#   - lines starting with # and blank lines are ignored
# Add more `omp config set` keys below as needed (the "등" in the deploy order).
#
# Shared profile: OpenAI Codex Pro only; no Anthropic credentials are required.
# Managed role, enabled-model, fallback, and advisor keys are explicit so re-running setup converges older profiles.

# --- current role routing (GPT-5.6 Sol/Terra main lanes; Codex Spark background; OpenAI-only specialist lanes) ---
modelRoles {"default":"openai-codex/gpt-5.6-sol:xhigh","smol":"openai-codex/gpt-5.6-terra:medium","task":"openai-codex/gpt-5.6-sol:xhigh","designer":"openai-codex/gpt-5.6-sol:xhigh","commit":"openai-codex/gpt-5.6-terra:medium","tiny":"openai-codex/gpt-5.3-codex-spark:low","slow":"openai-codex/gpt-5.6-sol:xhigh","plan":"openai-codex/gpt-5.6-sol:xhigh","vision":"openai-codex/gpt-5.6-sol:high","advisor":"openai-codex/gpt-5.6-terra:high"}

# --- session model scope: authenticated OpenAI Codex lanes only ---
enabledModels ["openai-codex/gpt-5.6-sol","openai-codex/gpt-5.6-terra","openai-codex/gpt-5.6-luna","openai-codex/gpt-5.3-codex-spark"]

# --- premium long-context window for GPT-5.6 subscription Codex models ---
extendedContext true

# --- no agent-specific pins; built-ins follow the current role models ---
task.agentModelOverrides {}

# --- response display: keep model reasoning active but hide thinking blocks in the TUI ---
hideThinkingBlock true
omitThinking false
proseOnlyThinking true
tui.renderMermaid true

# --- no fallback route until a second provider is authenticated in the shared profile ---
retry.fallbackChains {}
retry.modelFallback false
retry.fallbackRevertPolicy cooldown-expiry

# --- reserve policy retained for a future shared fallback; usage-aware switching is currently disabled ---
retry.usageReservePct 10
retry.usageReservePolicy auto
retry.usageAwareFallback false

# --- disable Anthropic Fable/Mythos safety-classifier fallback to legacy Opus 4.8 for any machine-local override ---
providers.anthropic.serverSideFallback false

# --- tool approvals: normal work is yolo; dangerous calls are gated by the extension hook ---
tools.approvalMode yolo
tools.approval {}

# --- subagent isolation: enable auto backend selection when isolated tasks are requested ---
task.isolation.enabled true
isolation.backend auto

# --- advisor disabled: the shared profile has no independent second provider ---
advisor.enabled false
advisor.syncBacklog 1
