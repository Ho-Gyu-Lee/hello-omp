# omp portable settings — applied via `omp config set <key> <value>`
# Format: <key><space><value>   (one per line)
#   - value is compact JSON (no spaces) for record/array keys, or a scalar
#   - lines starting with # and blank lines are ignored
# Add more `omp config set` keys below as needed (the "등" in the deploy order).
#
# Hard-development profile with role-specific reasoning; routine helpers are not deep-development tasks.
# Using every configured role and cross-provider fallback requires valid credentials for both providers.

# --- xhigh: main/plan/task/review; high: design/vision/advisor; medium: scout/commit; low: tiny/memory ---
modelRoles {"default":"anthropic/claude-opus-5-5:xhigh","smol":"openai-codex/gpt-6.1-sol:medium","task":"openai-codex/gpt-6.1-sol:xhigh","designer":"anthropic/claude-opus-5-5:high","commit":"openai-codex/gpt-6.1-sol:medium","tiny":"openai-codex/gpt-6-luna:low","memory":"openai-codex/gpt-6-luna:low","slow":"openai-codex/gpt-6-astra:xhigh","plan":"anthropic/claude-opus-5-5:xhigh","vision":"openai-codex/gpt-6-astra:high","advisor":"openai-codex/gpt-6.1-sol:high"}

# --- primary/fallback candidates plus Fable for explicit high-difficulty selection only ---
enabledModels ["anthropic/claude-opus-5-5","openai-codex/gpt-6-astra","openai-codex/gpt-6.1-sol","openai-codex/gpt-6-luna","anthropic/claude-haiku-5-5","anthropic/claude-sonnet-5-5","anthropic/claude-fable-5-1"]

# --- allow catalog-supported extended windows; long-context API pricing may apply ---
extendedContext true

# --- security reviewer has no bundled model; follow slow rather than inheriting the main ---
task.agentModelOverrides {"security-reviewer":"@slow"}

# --- OMP 18.8+: generate titles through tiny, not a fork of the main model ---
title.generator tiny

# --- response display: keep model reasoning active but hide thinking blocks in the TUI ---
hideThinkingBlock true
omitThinking false
proseOnlyThinking true
tui.renderMermaid true

# --- cross-provider fallbacks by workload: judgement Opus/Astra, execution Sol/Sonnet, tiny Luna/Haiku ---
retry.fallbackChains {"default":["openai-codex/gpt-6-astra:xhigh"],"smol":["anthropic/claude-sonnet-5-5:medium"],"task":["anthropic/claude-sonnet-5-5:xhigh"],"designer":["openai-codex/gpt-6-astra:high"],"commit":["anthropic/claude-sonnet-5-5:medium"],"tiny":["anthropic/claude-haiku-5-5:low"],"memory":["anthropic/claude-haiku-5-5:low"],"slow":["anthropic/claude-opus-5-5:xhigh"],"plan":["openai-codex/gpt-6-astra:xhigh"],"vision":["anthropic/claude-opus-5-5:high"],"advisor":["anthropic/claude-sonnet-5-5:high"]}
retry.modelFallback true
retry.fallbackRevertPolicy cooldown-expiry

# --- reliable coding-plan quota reports: auto-select an eligible fallback at 1% reserve ---
retry.usageReservePct 1
retry.usageReservePolicy auto
retry.usageAwareFallback true

# --- do not opt into Anthropic API server-side refusal fallback ---
providers.anthropic.serverSideFallback false

# --- tool approvals: normal work is yolo; dangerous calls are gated by the extension hook ---
tools.approvalMode yolo
tools.approval {}

# --- subagent isolation: enable auto backend selection when isolated tasks are requested ---
task.isolation.enabled true
isolation.backend auto

# --- in-progress advisor monitoring complements explicit pre-final independent review ---
advisor.enabled true
advisor.syncBacklog 1
