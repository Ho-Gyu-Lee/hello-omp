# omp portable settings — applied via `omp config set <key> <value>`
# Format: <key><space><value>   (one per line)
#   - value is compact JSON (no spaces) for record/array keys, or a scalar
#   - lines starting with # and blank lines are ignored
# Add more `omp config set` keys below as needed.
#
# Hard-development profile with role-specific reasoning; routine helpers are not deep-development tasks.
# Using every configured role and cross-provider fallback requires valid credentials for both providers.

# --- xhigh: main/plan/review; high: task/design/vision/advisor; medium: scout/commit; low: tiny/memory/widget; premium (Fable) exists only to allow per-call use ---
modelRoles {"default":"anthropic/claude-opus-5-5:xhigh","smol":"openai-codex/gpt-6.1-sol:medium","task":"anthropic/claude-opus-5-5:high","designer":"anthropic/claude-opus-5-5:high","commit":"openai-codex/gpt-6.1-sol:medium","tiny":"openai-codex/gpt-6-luna:low","memory":"openai-codex/gpt-6-luna:low","widget":"openai-codex/gpt-6-luna:low","slow":"openai-codex/gpt-6-astra:xhigh","plan":"anthropic/claude-opus-5-5:xhigh","vision":"openai-codex/gpt-6-astra:high","advisor":"openai-codex/gpt-6.1-sol:high","premium":"anthropic/claude-fable-5-1:xhigh","image":"openai-codex/gpt-image-2"}

# --- primary/fallback candidates plus Fable for per-call selection by the main session ---
enabledModels ["anthropic/claude-opus-5-5","openai-codex/gpt-6-astra","openai-codex/gpt-6.1-sol","openai-codex/gpt-6-luna","anthropic/claude-haiku-5-5","anthropic/claude-sonnet-5-5","anthropic/claude-fable-5-1"]

# --- allow catalog-supported extended windows; long-context API pricing may apply ---
extendedContext true

# --- security reviewer has no bundled model and the custom design-reviewer declares none; both follow slow rather than inheriting the main ---
task.agentModelOverrides {"security-reviewer":"@slow","design-reviewer":"@slow"}

# --- per-call model: task calls may pin only Fable; when to pin and when to ask first are set in RULES.md ---
task.perCallModel on
task.perCallModelAllow ["anthropic/claude-fable-5-1"]

# --- OMP 18.8+: generate titles through tiny, not a fork of the main model ---
title.generator tiny

# --- response display: keep model reasoning active but hide thinking blocks in the TUI ---
hideThinkingBlock true
omitThinking false
proseOnlyThinking true
tui.renderMermaid true

# --- cross-provider fallbacks by workload: judgement Opus/Astra, implementation Opus/Sol, helpers Sol/Sonnet, tiny Luna/Haiku; image and premium have none (image: subscription only, premium: Fable is never swapped) ---
retry.fallbackChains {"default":["openai-codex/gpt-6-astra:xhigh"],"smol":["anthropic/claude-sonnet-5-5:medium"],"task":["openai-codex/gpt-6.1-sol:xhigh"],"designer":["openai-codex/gpt-6-astra:high"],"commit":["anthropic/claude-sonnet-5-5:medium"],"tiny":["anthropic/claude-haiku-5-5:low"],"memory":["anthropic/claude-haiku-5-5:low"],"widget":["anthropic/claude-haiku-5-5:low"],"slow":["anthropic/claude-opus-5-5:xhigh"],"plan":["openai-codex/gpt-6-astra:xhigh"],"vision":["anthropic/claude-opus-5-5:high"],"advisor":["anthropic/claude-sonnet-5-5:high"],"premium":[],"image":[]}
retry.modelFallback true
retry.fallbackRevertPolicy cooldown-expiry

# --- reliable coding-plan quota reports: auto-select an eligible fallback at 1% reserve ---
retry.usageReservePct 1
retry.usageReservePolicy auto
retry.usageAwareFallback true

# --- do not opt into Anthropic API server-side refusal fallback ---
providers.anthropic.serverSideFallback false

# --- tool approvals: normal work is yolo; dangerous calls are gated by the extension hook ---
tools.approvalMode yolo
tools.approval {}

# --- subagent isolation: enable auto backend selection when isolated tasks are requested ---
task.isolation.enabled true
isolation.backend auto

# --- in-progress advisor monitoring (risk, excess process, user stops); complements, never replaces, independent review before risky execution ---
advisor.enabled true
advisor.syncBacklog 1

# --- image generation: generate_image tool on the Codex subscription model only (no API-billed fallback) ---
generate_image.enabled true
