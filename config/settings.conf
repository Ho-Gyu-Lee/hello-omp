# omp portable settings — applied via `omp config set <key> <value>`
# Format: <key><space><value>   (one per line)
#   - value is compact JSON (no spaces) for record/array keys, or a scalar
#   - lines starting with # and blank lines are ignored
# Add more `omp config set` keys below as needed (the "등" in the deploy order).
#
# Shared profile: OpenAI Codex Pro main lanes + Anthropic Claude Fable 5.1 deep/cross-provider lanes.
# Machines without Fable 5.1 entitlement must override Anthropic roles, fallbacks, and enabledModels locally.

# --- current role routing (GPT 5.6 Sol/Terra main lanes; Codex Spark background; Claude Fable 5.1 deep lanes) ---
modelRoles {"default":"openai-codex/gpt-5.6-sol:xhigh","smol":"openai-codex/gpt-5.6-terra:medium","task":"openai-codex/gpt-5.6-sol:xhigh","designer":"openai-codex/gpt-5.6-sol:xhigh","commit":"openai-codex/gpt-5.6-terra:medium","tiny":"openai-codex/gpt-5.3-codex-spark:low","slow":"anthropic/claude-fable-5-1:xhigh","plan":"anthropic/claude-fable-5-1:xhigh","vision":"anthropic/claude-fable-5-1:high","advisor":"anthropic/claude-fable-5-1:high"}

# --- session model scope: shared GPT lanes plus Claude Fable 5.1 ---
enabledModels ["openai-codex/gpt-5.6-sol","openai-codex/gpt-5.6-terra","openai-codex/gpt-5.6-luna","openai-codex/gpt-5.3-codex-spark","anthropic/claude-fable-5-1"]

# --- premium long-context window for GPT-5.6 subscription Codex models ---
extendedContext true

# --- no agent-specific pins; built-ins follow the current role models ---
task.agentModelOverrides {}

# --- response display: keep model reasoning active but hide thinking blocks in the TUI ---
hideThinkingBlock true
omitThinking false
proseOnlyThinking true
tui.renderMermaid true

# --- single cross-provider quota/429 fallback per role (all Anthropic lanes use Fable 5.1) ---
retry.fallbackChains {"default":["anthropic/claude-fable-5-1:high"],"smol":["anthropic/claude-fable-5-1:medium"],"task":["anthropic/claude-fable-5-1:high"],"designer":["anthropic/claude-fable-5-1:high"],"commit":["anthropic/claude-fable-5-1:low"],"tiny":["anthropic/claude-fable-5-1:low"],"slow":["openai-codex/gpt-5.6-sol:xhigh"],"plan":["openai-codex/gpt-5.6-sol:xhigh"],"vision":["openai-codex/gpt-5.6-sol:high"],"advisor":["openai-codex/gpt-5.6-terra:high"]}
retry.modelFallback true
retry.fallbackRevertPolicy cooldown-expiry

# --- proactive OAuth coding-plan quota routing; switch provider at 10% reserve without prompting ---
retry.usageReservePct 10
retry.usageReservePolicy auto
retry.usageAwareFallback true

# --- tool approvals: normal work is yolo; dangerous calls are gated by the extension hook ---
tools.approvalMode yolo
tools.approval {}

# --- subagent isolation: enable auto backend selection when isolated tasks are requested ---
task.isolation.enabled true
isolation.backend auto

# --- advisor: Claude Fable 5.1 reviews each GPT turn from the other provider's quota pool ---
advisor.enabled true
advisor.syncBacklog 1
