# omp portable settings — applied via `omp config set <key> <value>`
# Format: <key><space><value>   (one per line)
#   - value is compact JSON (no spaces) for record/array keys, or a scalar
#   - lines starting with # and blank lines are ignored
# Add more `omp config set` keys below as needed (the "등" in the deploy order).
#
# Shared profile: latest high-end OpenAI Codex and Anthropic models.
# Every target PC must authenticate both providers before running setup; Anthropic Pro uses the explicit override profile.

# --- current role routing (GPT-6 Astra designer; GPT-5.6 Sol/Terra main lanes; Claude Opus 5 deep/advisor; Claude Fable 5.1 vision) ---
modelRoles {"default":"openai-codex/gpt-5.6-sol:xhigh","smol":"openai-codex/gpt-5.6-terra:medium","task":"openai-codex/gpt-5.6-sol:xhigh","designer":"openai-codex/gpt-6-astra:xhigh","commit":"openai-codex/gpt-5.6-terra:medium","tiny":"openai-codex/gpt-5.3-codex-spark:low","slow":"anthropic/claude-opus-5:xhigh","plan":"anthropic/claude-opus-5:xhigh","vision":"anthropic/claude-fable-5-1:high","advisor":"anthropic/claude-opus-5:high"}

# --- session model scope: high-end GPT and Claude lanes ---
enabledModels ["openai-codex/gpt-6-astra","openai-codex/gpt-5.6-sol","openai-codex/gpt-5.6-terra","openai-codex/gpt-5.6-luna","openai-codex/gpt-5.3-codex-spark","anthropic/claude-opus-5","anthropic/claude-fable-5-1"]

# --- premium long-context window for GPT-5.6 subscription Codex models ---
extendedContext true

# --- no agent-specific pins; built-ins follow the current role models ---
task.agentModelOverrides {}

# --- response display: keep model reasoning active but hide thinking blocks in the TUI ---
hideThinkingBlock true
omitThinking false
proseOnlyThinking true
tui.renderMermaid true

# --- single cross-provider quota/429 fallback per role (Anthropic fallbacks use Opus 5 only) ---
retry.fallbackChains {"default":["anthropic/claude-opus-5:xhigh"],"smol":["anthropic/claude-opus-5:medium"],"task":["anthropic/claude-opus-5:xhigh"],"designer":["anthropic/claude-opus-5:xhigh"],"commit":["anthropic/claude-opus-5:medium"],"tiny":["anthropic/claude-opus-5:low"],"slow":["openai-codex/gpt-5.6-sol:xhigh"],"plan":["openai-codex/gpt-5.6-sol:xhigh"],"vision":["openai-codex/gpt-5.6-sol:high"],"advisor":["openai-codex/gpt-5.6-terra:high"]}
retry.modelFallback true
retry.fallbackRevertPolicy cooldown-expiry

# --- proactive OAuth coding-plan quota routing; switch provider at 10% reserve without prompting ---
retry.usageReservePct 10
retry.usageReservePolicy auto
retry.usageAwareFallback true

# --- disable provider-managed legacy Opus fallback; explicit Opus routes must use claude-opus-5 ---
providers.anthropic.serverSideFallback false

# --- tool approvals: normal work is yolo; dangerous calls are gated by the extension hook ---
tools.approvalMode yolo
tools.approval {}

# --- subagent isolation: enable auto backend selection when isolated tasks are requested ---
task.isolation.enabled true
isolation.backend auto

# --- advisor: Claude Opus 5 reviews each GPT turn from the other provider's quota pool ---
advisor.enabled true
advisor.syncBacklog 1
