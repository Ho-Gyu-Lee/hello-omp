# omp portable settings — applied via `omp config set <key> <value>`
# Format: <key><space><value>   (one per line)
#   - value is compact JSON (no spaces) for record/array keys, or a scalar
#   - lines starting with # and blank lines are ignored
# Add more `omp config set` keys below as needed (the "등" in the deploy order).

# --- current role routing (GPT 5.6 main/fast lanes; Claude Opus 5/Fable 5.1 specialist lanes) ---
modelRoles {"default":"openai-codex/gpt-5.6-sol:xhigh","smol":"openai-codex/gpt-5.6-terra:medium","task":"openai-codex/gpt-5.6-sol:xhigh","commit":"openai-codex/gpt-5.6-terra:medium","tiny":"openai-codex/gpt-5.6-luna:low","slow":"anthropic/claude-opus-5:high","plan":"anthropic/claude-opus-5:xhigh","designer":"openai-codex/gpt-5.6-sol:xhigh","vision":"anthropic/claude-fable-5-1:high","advisor":"anthropic/claude-opus-5:high"}

# --- no agent-specific pins; built-ins follow the current role models ---
task.agentModelOverrides {}

# --- response display: keep model reasoning active but hide thinking blocks in the TUI ---
hideThinkingBlock true
omitThinking false
proseOnlyThinking true
tui.renderMermaid true

# --- single cross-provider quota/429 fallback per role ---
retry.fallbackChains {"default":["anthropic/claude-opus-5:xhigh"],"smol":["anthropic/claude-sonnet-5:medium"],"task":["anthropic/claude-opus-5:xhigh"],"commit":["anthropic/claude-sonnet-5:medium"],"tiny":["anthropic/claude-sonnet-5:low"],"slow":["openai-codex/gpt-5.6-sol:high"],"plan":["openai-codex/gpt-5.6-sol:xhigh"],"designer":["anthropic/claude-opus-5:xhigh"],"vision":["openai-codex/gpt-5.6-sol:high"],"advisor":["openai-codex/gpt-5.6-sol:high"]}
retry.modelFallback true

# --- proactive OAuth coding-plan quota routing; switch provider at 5% reserve ---
retry.usageReservePct 5
retry.usageReservePolicy auto
retry.usageAwareFallback true

# --- disable Anthropic Fable/Mythos safety-classifier fallback to legacy Opus 4.8 ---
providers.anthropic.serverSideFallback false

# --- tool approvals: normal work is yolo; dangerous calls are gated by the extension hook ---
tools.approvalMode yolo
tools.approval {}

# --- subagent isolation: enable auto backend selection when isolated tasks are requested ---
task.isolation.mode auto

# --- advisor: stronger model passively reviews each turn, with bounded catch-up ---
advisor.enabled true
advisor.syncBacklog 1
