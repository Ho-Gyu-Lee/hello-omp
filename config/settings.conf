# omp portable settings — applied via `omp config set <key> <value>`
# Format: <key><space><value>   (one per line)
#   - value is compact JSON (no spaces) for record/array keys, or a scalar
#   - lines starting with # and blank lines are ignored
# Add more `omp config set` keys below as needed.
#
# Hard-development profile with role-specific reasoning; routine helpers are not deep-development tasks.
# Using every configured role and cross-provider fallback requires valid credentials for both providers.

# --- xhigh: main/plan/review/task; high: design/vision/advisor; medium: scout/commit; low: tiny/memory/widget; premium (Fable) allows per-call use and is design-drafter's primary ---
# --- provider split: main/plan on Anthropic Opus; implementation task on GPT-6.2 Astra so Opus review (slow) cross-checks it; vision on Astra, advisor on GPT-6.2 Sol; scout/commit stay on GPT-6.1 Sol (GPT-6.2 Sol regressed on repository Q&A) ---
modelRoles {"default":"anthropic/claude-opus-5-5:xhigh","smol":"openai-codex/gpt-6.1-sol:medium","task":"openai-codex/gpt-6.2-astra:xhigh","designer":"anthropic/claude-opus-5-5:high","commit":"openai-codex/gpt-6.1-sol:medium","tiny":"openai-codex/gpt-6-luna:low","memory":"openai-codex/gpt-6-luna:low","widget":"openai-codex/gpt-6-luna:low","slow":"anthropic/claude-opus-5-5:xhigh","plan":"anthropic/claude-opus-5-5:xhigh","vision":"openai-codex/gpt-6.2-astra:high","advisor":"openai-codex/gpt-6.2-sol:high","premium":"anthropic/claude-fable-5-2:xhigh","image":"openai-codex/gpt-image-2"}

# --- primary/fallback candidates plus Fable for per-call selection by the main session ---
enabledModels ["anthropic/claude-opus-5-5","openai-codex/gpt-6.2-astra","openai-codex/gpt-6.2-sol","openai-codex/gpt-6.1-sol","openai-codex/gpt-6-luna","anthropic/claude-haiku-5-5","anthropic/claude-sonnet-5-5","anthropic/claude-fable-5-2"]

# --- allow catalog-supported extended windows; long-context API pricing may apply ---
extendedContext true

# --- security reviewer has no bundled model and follows slow rather than inheriting the main; custom agents set their model in agents/*.md so per-call models stay allowed ---
task.agentModelOverrides {"security-reviewer":"@slow"}

# --- per-call model: task calls may pin only Fable and GPT-6.2 Astra (Astra review of Anthropic-authored code); when to pin and when to ask first are set in RULES.md ---
task.perCallModel on
task.perCallModelAllow ["anthropic/claude-fable-5-2","openai-codex/gpt-6.2-astra"]

# --- OMP 19.0+: this key no longer gates the lsp tool; it makes subagent edits/writes use the main session's LSP formatting and diagnostics settings ---
task.enableLsp true

# --- show the model each subagent actually ran on, so a reviewer that fell back to the author's provider is visible ---
task.showResolvedModelBadge true

# --- OMP 18.8+: generate titles through tiny, not a fork of the main model ---
title.generator tiny

# --- response display: keep model reasoning active but hide thinking blocks in the TUI ---
hideThinkingBlock true
omitThinking false
proseOnlyThinking true
tui.renderMermaid true

# --- cross-provider fallbacks by workload: judgement and implementation Opus/Astra 6.2 at the same effort, helpers Sol/Sonnet, tiny Luna/Haiku; image and premium have none (image: subscription only, premium: Fable is never swapped) ---
retry.fallbackChains {"default":["openai-codex/gpt-6.2-astra:xhigh"],"smol":["anthropic/claude-sonnet-5-5:medium"],"task":["anthropic/claude-opus-5-5:xhigh"],"designer":["openai-codex/gpt-6.2-astra:high"],"commit":["anthropic/claude-sonnet-5-5:medium"],"tiny":["anthropic/claude-haiku-5-5:low"],"memory":["anthropic/claude-haiku-5-5:low"],"widget":["anthropic/claude-haiku-5-5:low"],"slow":["openai-codex/gpt-6.2-astra:xhigh"],"plan":["openai-codex/gpt-6.2-astra:xhigh"],"vision":["anthropic/claude-opus-5-5:high"],"advisor":["anthropic/claude-sonnet-5-5:high"],"premium":[],"image":[]}
retry.modelFallback true
retry.fallbackRevertPolicy cooldown-expiry

# --- reliable coding-plan quota reports: auto-select an eligible fallback at 1% reserve ---
retry.usageReservePct 1
retry.usageReservePolicy auto
retry.usageAwareFallback true

# --- do not opt into Anthropic API server-side refusal fallback ---
providers.anthropic.serverSideFallback false

# --- tool approvals: normal work is yolo; dangerous calls are gated by the extension hook ---
tools.approvalMode yolo
tools.approval {}

# --- subagent isolation: enable auto backend selection when isolated tasks are requested ---
task.isolation.enabled true
isolation.backend auto

# --- in-progress advisor monitoring (risk, excess process, user stops); complements, never replaces, independent review before risky execution ---
advisor.enabled true
advisor.syncBacklog 1

# --- image generation: generate_image tool on the Codex subscription model only (no API-billed fallback) ---
generate_image.enabled true
