# omp portable settings — applied via `omp config set <key> <value>`
# Format: <key><space><value>   (one per line)
#   - value is compact JSON (no spaces) for record/array keys, or a scalar
#   - lines starting with # and blank lines are ignored
# Add more `omp config set` keys below as needed (the "등" in the deploy order).
#
# Shared profile: configured high-end OpenAI Codex and Anthropic model lanes.
# Using every configured role and cross-provider fallback requires valid credentials for both providers.

# --- current role routing (GPT-6 Astra main/designer; GPT-5.6 Terra lightweight; GPT-5.6 Luna tiny; Claude Opus 5 deep/advisor; Claude Fable 5.1 vision) ---
modelRoles {"default":"openai-codex/gpt-6-astra:xhigh","smol":"openai-codex/gpt-5.6-terra:medium","task":"openai-codex/gpt-6-astra:xhigh","designer":"openai-codex/gpt-6-astra:xhigh","commit":"openai-codex/gpt-5.6-terra:medium","tiny":"openai-codex/gpt-5.6-luna:low","slow":"anthropic/claude-opus-5:xhigh","plan":"anthropic/claude-opus-5:xhigh","vision":"anthropic/claude-fable-5-1:high","advisor":"anthropic/claude-opus-5:high"}

# --- session model scope: high-end GPT and Claude lanes ---
enabledModels ["openai-codex/gpt-6-astra","openai-codex/gpt-5.6-sol","openai-codex/gpt-5.6-terra","openai-codex/gpt-5.6-luna","anthropic/claude-opus-5","anthropic/claude-fable-5-1"]

# --- allow catalog-supported extended windows; long-context API pricing may apply ---
extendedContext true

# --- no agent-specific pins; built-ins follow the current role models ---
task.agentModelOverrides {}

# --- response display: keep model reasoning active but hide thinking blocks in the TUI ---
hideThinkingBlock true
omitThinking false
proseOnlyThinking true
tui.renderMermaid true

# --- one cross-provider fallback candidate per role; switching depends on runtime eligibility ---
retry.fallbackChains {"default":["anthropic/claude-opus-5:xhigh"],"smol":["anthropic/claude-opus-5:medium"],"task":["anthropic/claude-opus-5:xhigh"],"designer":["anthropic/claude-opus-5:xhigh"],"commit":["anthropic/claude-opus-5:medium"],"tiny":["anthropic/claude-opus-5:low"],"slow":["openai-codex/gpt-6-astra:xhigh"],"plan":["openai-codex/gpt-6-astra:xhigh"],"vision":["openai-codex/gpt-6-astra:high"],"advisor":["openai-codex/gpt-5.6-terra:high"]}
retry.modelFallback true
retry.fallbackRevertPolicy cooldown-expiry

# --- reliable coding-plan quota reports: auto-select an eligible fallback at 10% reserve ---
retry.usageReservePct 10
retry.usageReservePolicy auto
retry.usageAwareFallback true

# --- do not opt into Anthropic API server-side refusal fallback ---
providers.anthropic.serverSideFallback false

# --- tool approvals: normal work is yolo; dangerous calls are gated by the extension hook ---
tools.approvalMode yolo
tools.approval {}

# --- subagent isolation: enable auto backend selection when isolated tasks are requested ---
task.isolation.enabled true
isolation.backend auto

# --- in-progress advisor monitoring complements explicit pre-final independent review ---
advisor.enabled true
advisor.syncBacklog 1
